name: CI & Deploy

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for the automatic GITHUB_TOKEN; nothing here needs to write to the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: API tests (incl. Modulith boundary check)
        working-directory: api
        run: chmod +x gradlew && ./gradlew test --no-daemon

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Web build
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: [self-hosted, basecamp]
    concurrency: deploy-production
    env:
      ENV_FILE: /opt/basecamp/.env
    steps:
      - uses: actions/checkout@v4

      - name: Build and start containers
        run: docker compose --env-file "$ENV_FILE" up -d --build --remove-orphans

      - name: Wait for API health
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null; then echo "API healthy"; exit 0; fi
            sleep 3
          done
          docker compose --env-file "$ENV_FILE" logs --tail 100 api
          exit 1

      - name: Smoke test through the web container
        run: curl -fsS http://127.0.0.1:3000/api/ping

      - name: Clean up old images
        run: docker image prune -f
