spring:
  application:
    name: basecamp
  datasource:
    url: jdbc:postgresql://localhost:5432/basecamp
    username: basecamp
    password: basecamp
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    schemas: public
    create-schemas: true
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 1GB      # CS2 demos run 50-300+ MB; the actual cap enforced is basecamp.analysis.max-demo-size-bytes
      max-request-size: 1GB
  session:
    timeout: 90d            # idle timeout, sliding: every request extends it
    jdbc:
      initialize-schema: never

server:
  forward-headers-strategy: framework   # trust X-Forwarded-* from nginx / Tailscale Serve
  servlet:
    session:
      cookie:
        name: BASECAMP_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}   # scripts\dev.ps1 sets false for plain http://localhost
        same-site: lax
        max-age: 180d       # absolute lifetime of the cookie: a full re-login at least every 180 days

basecamp:
  bootstrap-admin:          # only used while the user table is empty
    username: ${BASECAMP_ADMIN_USER:admin}
    password: ${BASECAMP_ADMIN_PASSWORD:}

  faceit:                   # FACEIT Data API v4; the key is a server-side secret and never reaches the browser
    base-url: https://open.faceit.com/data/v4
    api-key: ${FACEIT_API_KEY:}
  leetify:                  # Leetify public API; works without a key at a lower rate limit
    base-url: https://api-public.cs-prod.leetify.com
    api-key: ${LEETIFY_API_KEY:}

  push:                     # Web Push (VAPID). Generate the keys once with: node scripts/generate-vapid-keys.mjs
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:}   # for example mailto:you@example.com

  analysis:                 # Gaming > CS2 > Analysis: .dem upload and parsing (see analysis-parser/, api/Dockerfile)
    demo-storage-dir: ${BASECAMP_DEMO_STORAGE_DIR:/data/demos}
    parser-binary: ${BASECAMP_ANALYSIS_PARSER_BIN:/app/analysis-parser}
    max-demo-size-bytes: 400000000   # ~400 MB; generous for a long/OT match, well under the 1 GB HTTP cap above
    parse-timeout-seconds: 300

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/swagger-ui
